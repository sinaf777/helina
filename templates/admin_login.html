<!doctype html><html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="card"><p class="eyebrow">ADMIN / አስተዳዳሪ</p><h1>Admin Login / የአስተዳዳሪ መግቢያ</h1>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<p class="notice {{ category }}">{{ message }}</p>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label for="username">Username / የተጠቃሚ ስም</label><input id="username" name="username" autocomplete="username" required></div><div class="field"><label for="password">Password / የይለፍ ቃል</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button type="submit">Sign in / ግባ</button></form><p class="privacy-note">Only the site administrator should sign in here. / አስተዳዳሪው ብቻ ይግባ።</p></main></body></html>
